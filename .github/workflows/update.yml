name: Обновить календарь из Google Таблиц

on:
  schedule:
    - cron: '10 * * * *'      # каждый час в :10 UTC (GitHub может задержать запуск)
  workflow_dispatch:           # кнопка «Run workflow» — обновить прямо сейчас

permissions:
  contents: write

concurrency:
  group: sync-calendar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Библиотеки Google
        run: pip install --quiet google-auth google-auth-oauthlib google-api-python-client

      - name: Проверить, что секрет на месте
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          if [ -z "$GOOGLE_TOKEN_JSON" ]; then
            echo "::error::Нет секрета GOOGLE_TOKEN_JSON — добавьте его в Settings → Secrets → Actions"
            exit 1
          fi

      - name: Прочитать таблицы и собрать страницу
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: python3 tools/sync.py | tee /tmp/sync.log

      - name: Закоммитить, если данные изменились
        run: |
          if git diff --quiet -- index.html tools/data.json; then
            echo "Изменений в таблицах нет — коммит не нужен" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          git config user.name "calendar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tools/data.json
          git commit -m "Автообновление из Google Таблиц ($(TZ=Europe/Moscow date +'%d.%m.%Y %H:%M МСК'))"
          git push
          {
            echo "### Календарь обновлён"
            echo '```'
            cat /tmp/sync.log
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
