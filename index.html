<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Календарь команды — контент экспертов</title>
<meta name="description" content="Единый календарь: что и в какой день делает команда и эксперты">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#14171f; --ink2:#5b6472; --ink3:#8b94a3;
  --line:#e4e7ec; --line2:#eef0f4; --accent:#3b5bdb; --today:#fff8e6; --todayline:#f2b40f;
  --s1:#7c5cff; --s2:#e8a317; --s3:#2e7cf6; --s4:#e0424b; --s5:#12a37a;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.05);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]){
  --bg:#0e1116; --card:#161a21; --ink:#eef1f6; --ink2:#a4adbb; --ink3:#79828f;
  --line:#252b34; --line2:#1e232b; --accent:#7d97ff; --today:#221d0c; --todayline:#c99b1c;
  --s1:#9b82ff; --s2:#f0b542; --s3:#5d9bff; --s4:#f4707a; --s5:#2cc79b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
 }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
 -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
a{color:var(--accent)}
h1,h2,h3{margin:0;letter-spacing:-.02em}

/* ---------- header ---------- */
header.top{background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:22px 18px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600}
h1{font-size:27px;margin:6px 0 4px;font-weight:680}
.sub{color:var(--ink2);font-size:14px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:104px}
.stat b{display:block;font-size:20px;font-weight:680;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}

/* ---------- today panel ---------- */
.now{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.nowcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.nowcard.is-today{border-color:var(--todayline);background:linear-gradient(180deg,var(--today),var(--card) 70%)}
.nowcard h3{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);font-weight:700}
.nowcard .dt{font-size:17px;font-weight:660;margin:2px 0 10px}
.nowlist{display:flex;flex-direction:column;gap:7px}
.empty{color:var(--ink3);font-size:13.5px;padding:4px 0}

/* ---------- toolbar ---------- */
.toolbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
 backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-top:22px}
.toolbar .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:10px}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.tabs button{appearance:none;border:0;background:transparent;color:var(--ink2);font:inherit;font-size:13.5px;
 font-weight:560;padding:6px 13px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
.spacer{flex:1}
.ctl{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
 border-radius:10px;padding:5px 10px;font-size:13.5px;color:var(--ink2);cursor:pointer;position:relative}
.ctl select{appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-size:13.5px;cursor:pointer;padding-right:2px}
.ctl input{accent-color:var(--accent)}
.chipbar{display:flex;flex-wrap:wrap;gap:6px;padding-block:0 12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;
 padding:4px 11px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:520}
.chip.on{color:var(--ink);border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.off{opacity:.45}

/* ---------- stage dots ---------- */
.st1{color:var(--s1)} .st2{color:var(--s2)} .st3{color:var(--s3)} .st4{color:var(--s4)} .st5{color:var(--s5)}

/* ---------- task row ---------- */
.task{display:grid;grid-template-columns:18px minmax(130px,1.05fr) minmax(150px,1.5fr) auto;
 gap:10px;align-items:center;padding:7px 10px;border-radius:9px;border:1px solid var(--line2);
 border-left:3px solid currentColor;background:color-mix(in srgb,currentColor 7%,var(--bg))}
.task:hover{border-color:var(--line);border-left-color:currentColor}
.task .bar{width:4px;height:20px;border-radius:3px;background:currentColor;justify-self:center}
.task .who{font-weight:600;font-size:14px;color:var(--ink);cursor:pointer;text-align:left;
 background:none;border:0;font-family:inherit;padding:0}
.task .who:hover{text-decoration:underline}
.task .act{font-size:13.5px;color:var(--ink2)}
.task .act b{color:currentColor;font-weight:620}
.task .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.badge{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--card);border:1px solid var(--line);color:var(--ink3);white-space:nowrap}
.badge.warn{color:#b45309;border-color:#f3cf8a;background:#fff7e6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.warn{color:#f0b542;background:#2a220e;border-color:#5a4718}}
.task.done{opacity:.45}
.task.done .act,.task.done .who{text-decoration:line-through}
.cb{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}

/* ---------- day cards ---------- */
.weekhead{display:flex;align-items:center;gap:12px;margin:26px 0 12px;color:var(--ink3);
 font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.1em}
.weekhead::after{content:"";flex:1;height:1px;background:var(--line)}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
 padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);scroll-margin-top:110px}
.day.today{border-color:var(--todayline);box-shadow:0 0 0 3px color-mix(in srgb,var(--todayline) 22%,transparent),var(--shadow)}
.day.past{opacity:.62}
.dayhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.daynum{font-size:19px;font-weight:680;letter-spacing:-.02em}
.dayw{font-size:13px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;font-weight:640}
.dayw.we{color:var(--s4)}
.daytag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
 background:var(--todayline);color:#231a00;border-radius:5px;padding:2px 7px}
.daycount{margin-left:auto;font-size:12.5px;color:var(--ink3)}
.group{margin-top:10px}
.grouplabel{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
 color:var(--ink3);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.grouplabel i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
.grouplabel.exp i{background:var(--s2)}
.rows{display:flex;flex-direction:column;gap:6px}
.absnote{margin-top:10px;font-size:12.5px;color:var(--ink3);border-top:1px dashed var(--line);padding-top:8px}

/* ---------- week grid ---------- */
.navrow{display:flex;align-items:center;gap:10px;margin:18px 0 12px}
.navrow h2{font-size:18px;font-weight:660}
.nav{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
 width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:15px;line-height:1}
.gridwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
table.wk{border-collapse:collapse;width:100%;min-width:860px}
table.wk th,table.wk td{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);
 padding:8px 9px;vertical-align:top;text-align:left}
table.wk th{position:sticky;top:0;background:var(--card);z-index:2;font-size:12px;font-weight:660;color:var(--ink2)}
table.wk th.dcol small{display:block;color:var(--ink3);font-weight:520;font-size:11px}
table.wk th.today,table.wk td.today{background:var(--today)}
table.wk td.ecol,table.wk th.ecol{position:sticky;left:0;background:var(--card);z-index:1;min-width:150px;
 font-size:13px;font-weight:580;border-right:1px solid var(--line)}
table.wk th.ecol{z-index:3}
.mini{display:block;font-size:11.5px;font-weight:600;border-radius:6px;padding:3px 6px;margin-bottom:3px;
 background:color-mix(in srgb,currentColor 13%,transparent);border-left:3px solid currentColor;line-height:1.3}
.mini em{font-style:normal;color:var(--ink3);font-weight:520}
.miniout{display:block;font-size:11px;color:var(--ink3);background:repeating-linear-gradient(45deg,var(--line2),var(--line2) 5px,transparent 5px,transparent 10px);
 border-radius:6px;padding:3px 6px;text-align:center}

/* ---------- month ---------- */
.months{display:grid;gap:18px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px 16px;box-shadow:var(--shadow)}
.mcard h3{font-size:16px;font-weight:660;margin-bottom:10px;text-transform:capitalize}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mgrid .wd{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;text-align:center;padding-bottom:4px;font-weight:640}
.mcell{min-height:74px;border:1px solid var(--line2);border-radius:9px;padding:5px 6px;background:var(--bg);cursor:pointer;text-align:left;font:inherit}
.mcell:hover{border-color:var(--accent)}
.mcell.blank{background:transparent;border-color:transparent;cursor:default}
.mcell.today{background:var(--today);border-color:var(--todayline)}
.mcell .n{font-size:12.5px;font-weight:660;color:var(--ink2);display:flex;justify-content:space-between;align-items:center}
.mcell .n b{font-size:10.5px;font-weight:700;color:var(--ink3)}
.dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}
.mnames{margin-top:3px;font-size:10.5px;color:var(--ink3);line-height:1.35;overflow:hidden}

/* ---------- experts ---------- */
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.excard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
.excard h3{font-size:16px;font-weight:660}
.excard .lnk{font-size:12.5px}
.cyc{margin-top:11px}
.cyc .cname{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.chain{display:flex;flex-wrap:wrap;gap:5px}
.step{font-size:11.5px;border-radius:7px;padding:3px 8px;border-left:3px solid currentColor;
 background:color-mix(in srgb,currentColor 12%,transparent);font-weight:600;white-space:nowrap}
.step em{font-style:normal;color:var(--ink3);font-weight:520}
dl.facts{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px}
dl.facts dt{color:var(--ink3);white-space:nowrap}
dl.facts dd{margin:0;color:var(--ink2)}
.note{margin-top:11px;font-size:12.5px;background:#fff7e6;border:1px solid #f3cf8a;color:#7a4c07;border-radius:9px;padding:8px 10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .note{background:#2a220e;border-color:#5a4718;color:#f0b542}}

footer{color:var(--ink3);font-size:12.5px;padding:32px 0 44px;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-bottom:10px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;background:currentColor}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,13,18,.5);z-index:90;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--card);z-index:91;
 border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s ease;overflow-y:auto;padding:18px 20px 40px}
.drawer.on{transform:none}
.drawer .x{position:absolute;top:12px;right:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);
 width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px}

@media (max-width:760px){
 .now{grid-template-columns:1fr}
 h1{font-size:22px}
 .task{grid-template-columns:18px 1fr;row-gap:2px}
 .task .bar{grid-row:span 3}
 .task .meta{justify-content:flex-start}
 .toolbar .wrap{gap:8px}
 .mcell{min-height:58px}
 .mnames{display:none}
}
@media print{
 .toolbar,.chipbar,.scrim,.drawer,.cb,.nav{display:none!important}
 body{background:#fff}
 .day{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>

<header class="top">
 <div class="wrap">
  <div class="eyebrow">Продюсерский центр · производство контента</div>
  <h1>Календарь команды</h1>
  <div class="sub" id="subline"></div>
  <div class="stats" id="stats"></div>
  <div class="now" id="nowpanel"></div>
 </div>
</header>

<div class="toolbar">
 <div class="wrap">
  <div class="tabs" role="tablist" id="tabs">
   <button role="tab" data-view="days" aria-selected="true">По дням</button>
   <button role="tab" data-view="week" aria-selected="false">Неделя</button>
   <button role="tab" data-view="month" aria-selected="false">Месяц</button>
   <button role="tab" data-view="experts" aria-selected="false">Эксперты</button>
  </div>
  <label class="ctl" title="Показывать только задачи команды или только то, что ждём от экспертов">
   <select id="whoSel">
    <option value="all">Все задачи</option>
    <option value="Команда">Только команда</option>
    <option value="Эксперт">Только эксперты</option>
   </select>
  </label>
  <label class="ctl"><input type="checkbox" id="pastCb"> прошедшие дни</label>
  <label class="ctl"><input type="checkbox" id="doneCb"> скрыть выполненные</label>
  <div class="spacer"></div>
  <button class="ctl" id="todayBtn">↓ К сегодня</button>
 </div>
 <div class="wrap"><div class="chipbar" id="chips"></div></div>
</div>

<main class="wrap" id="main"></main>

<footer class="wrap">
 <div class="legend" id="legend"></div>
 <div id="footnote"></div>
</footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<script>
const DATA =
{
 "experts": [
  {
   "name": "Алиса Заза",
   "sheet": "https://docs.google.com/spreadsheets/d/1lIr3NCDCvjAJGgAyZtim2QpNZ8YvQnd7DeK8XYYUfDo/edit",
   "start": "17.09.2026",
   "voice": "Вторник, среда, четверг, пятница — любое время с 13:00",
   "shoot": "Вторник, среда, четверг, пятница — любое время с 13:00, например каждую среду. Суббота/воскресенье часто занята (занятия по харизме, клиенты). Отпусков и командировок до конца 2026 не планируется",
   "volume": "Комфортнее 7 роликов за один подход",
   "lead": "Желательно за день до съёмки",
   "notes": [],
   "absences": []
  },
  {
   "name": "Анна Доценко",
   "sheet": "https://docs.google.com/spreadsheets/d/1TS5khzH-Bc_wLwkSDqLWPflse5UfLaj1BJPZfv_vwcw/edit",
   "start": "17.09.2026",
   "voice": "ТЗ (темы) — в чт или пт. Отвечает (голосовыми) уже на выходных, чтобы было время подумать",
   "shoot": "Творческий процесс — на выходных, может сразу отснять. Финально отдаёт материал в Пн-Вт. Важно, чтобы выходные не были жёстко привязаны к обязательному дедлайну",
   "volume": "Ответ не получен",
   "lead": "Ответ не получен",
   "notes": [],
   "absences": []
  },
  {
   "name": "Евгения Клинчук",
   "sheet": "https://docs.google.com/spreadsheets/d/1uLbIl8uVwuOyEERGxfP94Czraym5jKQ5aWOCLmW5yL4/edit",
   "start": "14.09.2026",
   "voice": "Любой будний день, вечером",
   "shoot": "Понедельник, среда, пятница — самые свободные дни, точное время пока не фиксирует (начнёт с любого варианта, точнее со второй недели). Точно исключены субботы, изредка (раз в несколько месяцев) — пт-вс. Известные даты отсутствия: 12–15.11 и 27–29.11 (учёба). В октябре часть времени во Вьетнаме, но работает в обычном ритме",
   "volume": "Пока не определено — начинает, чтобы понять формат; точный объём будет ясен со второй недели",
   "lead": "За день до съёмки",
   "notes": [],
   "absences": [
    {
     "from": "2026-11-12",
     "to": "2026-11-15",
     "label": "учёба"
    },
    {
     "from": "2026-11-27",
     "to": "2026-11-29",
     "label": "учёба"
    }
   ]
  },
  {
   "name": "Екатерина Грабовская",
   "sheet": "https://docs.google.com/spreadsheets/d/1sY2-bQdCVSBQpCZFtubv_fhaVLE5gTjmTfQA9UB5qG0/edit",
   "start": "14.09.2026",
   "voice": "Без чётких ограничений",
   "shoot": "Без чётких ограничений. Выходные — только при необходимости",
   "volume": "Ответ не получен",
   "lead": "Ответ не получен",
   "notes": [],
   "absences": []
  },
  {
   "name": "Инна Чеботаева",
   "sheet": "https://docs.google.com/spreadsheets/d/1PXinLwOLTTUP5FIq0EMDWKodI_WIupeF7iWFhG7RuXI/edit",
   "start": "14.09.2026",
   "voice": "В будни — понедельник или вторник",
   "shoot": "Суббота-воскресенье, чтобы делать это днём",
   "volume": "3-4 ролика обычно, иногда 5, а иногда только 1 — зависит от сложности роликов",
   "lead": "За день — чтобы можно было ознакомиться и задать вопросы",
   "notes": [],
   "absences": []
  },
  {
   "name": "Ирина Савушкина",
   "sheet": "https://docs.google.com/spreadsheets/d/1blV-ux2JMLqlUl_XYXjc6mDMuYY5MaBtjO0Xe48ImKI/edit",
   "start": "14.09.2026",
   "voice": "Будни — после 18:00, выходные — с 14:00",
   "shoot": "Будни — после 18:00, выходные — с 14:00. Стоп-дней сейчас нет — сообщит, если появятся",
   "volume": "По факту: если время позволяет снять больше одного ролика за подход — снимет больше, если нет — по 1",
   "lead": "За 3 дня",
   "notes": [],
   "absences": []
  },
  {
   "name": "Марина Философ",
   "sheet": "https://docs.google.com/spreadsheets/d/1r_4lGNdVkRLFP3Wpshh86KJmw7nYlnBlX-2tm99xD54/edit",
   "start": "21.09.2026",
   "voice": "Любой день, любое время — без предпочтений. Комфортнее, если сб/вс будут выходными (не жёсткое условие).",
   "shoot": "Любой день, вторая половина дня. Предпочтительно не сб/вс — в выходные могут быть гости. Воскресенье — никогда не съёмочный день (жёсткое правило). Локация не важна, может снимать в любом городе.",
   "volume": "7-10 роликов за один подход, если формат «говорящая голова». Если по сценарию нужны разные локации/образы — может быть по 1 ролику в день (зависит от сценария конкретного ролика).",
   "lead": "Обычно за 1-2 дня. Если сценарию нужна сложная организационная подготовка — за неделю.",
   "notes": [],
   "absences": []

 for(let k=0;k<ev.days;k++){
  const day=addDays(ev.start,k);
  SLOTS.push({id,day,part:k+1,total:ev.days,expert:ev.expert,cycle:ev.cycle,
   stage:ev.stage,who:ev.who,start:ev.start,end:ev.end,
   absence:absentOn(ev.expert,day)});
 }
});
SLOTS.sort((a,b)=>a.day.localeCompare(b.day)||STAGES[a.stage].n-STAGES[b.stage].n||a.expert.localeCompare(b.expert));
const BYDAY={};SLOTS.forEach(s=>(BYDAY[s.day]=BYDAY[s.day]||[]).push(s));
const ALLDAYS=Object.keys(BYDAY).sort();
const FIRST=ALLDAYS[0], LAST=ALLDAYS[ALLDAYS.length-1];

/* ================= state ================= */
const LS='teamcal_done_v1';
let done=new Set();
try{done=new Set(JSON.parse(localStorage.getItem(LS)||'[]'))}catch(e){}
const saveDone=()=>{try{localStorage.setItem(LS,JSON.stringify([...done]))}catch(e){}};
const st={view:'days',who:'all',stages:new Set(ORDER),experts:new Set(EXPERTS.map(e=>e.name)),
          past:false,hideDone:false,
          week:weekStart(TODAY>=FIRST&&TODAY<=LAST?TODAY:FIRST)};
function weekStart(d){return addDays(d,-dow(d))}
const pass=s=>st.stages.has(s.stage)&&st.experts.has(s.expert)&&(st.who==='all'||s.who===st.who)
              &&!(st.hideDone&&done.has(s.id));
const daySlots=d=>(BYDAY[d]||[]).filter(pass);

/* ================= pieces ================= */
function taskRow(s,compact){
 const m=STAGES[s.stage], isDone=done.has(s.id);
 const badges=[];
 if(s.total>1)badges.push(`<span class="badge">день ${s.part} из ${s.total} · ${fmtShort(s.start)}–${fmtShort(s.end)}</span>`);
 badges.push(`<span class="badge">${esc(s.cycle||'')}</span>`);
 if(s.absence)badges.push(`<span class="badge warn">⚠ эксперт ${esc(s.absence.label)}</span>`);
 return `<div class="task ${m.cls} ${isDone?'done':''}" data-id="${esc(s.id)}">
   <input class="cb" type="checkbox" ${isDone?'checked':''} aria-label="Выполнено">
   <button class="who" data-expert="${esc(s.expert)}">${esc(s.expert)}</button>
   <div class="act"><b>${m.short}</b> — ${m.act}</div>
   <div class="meta">${badges.join('')}</div>
 </div>`;
}
function dayCard(d,opts={}){
 const list=daySlots(d);
 const team=list.filter(s=>s.who==='Команда'), exp=list.filter(s=>s.who==='Эксперт');
 const isToday=d===TODAY, isPast=d<TODAY;
 const abs=EXPERTS.filter(e=>st.experts.has(e.name)&&absentOn(e.name,d));
 let g='';
 if(team.length)g+=`<div class="group"><div class="grouplabel"><i></i>Команда делает (${team.length})</div>
   <div class="rows">${team.map(s=>taskRow(s)).join('')}</div></div>`;
 if(exp.length)g+=`<div class="group"><div class="grouplabel exp"><i></i>Ждём от эксперта (${exp.length})</div>
   <div class="rows">${exp.map(s=>taskRow(s)).join('')}</div></div>`;
 if(!list.length)g=`<div class="empty">Задач нет${abs.length?'':' — свободный день'}</div>`;
 if(abs.length)g+=`<div class="absnote">Нет на связи: ${abs.map(e=>esc(e.name)+' ('+fmtShort(absentOn(e.name,d).from)+'–'+fmtShort(absentOn(e.name,d).to)+')').join(', ')}</div>`;
 const wd=dow(d);
 return `<section class="day ${isToday?'today':''} ${isPast&&!isToday?'past':''}" id="d${d}">
  <div class="dayhead">
   <span class="daynum">${fmt(d)}</span>
   <span class="dayw ${wd>4?'we':''}">${WDFULL[wd]}</span>
   ${isToday?'<span class="daytag">сегодня</span>':''}
   ${d===addDays(TODAY,1)?'<span class="badge">завтра</span>':''}
   <span class="daycount">${list.length?list.length+' '+plural(list.length,'задача','задачи','задач'):''}</span>
  </div>${g}</section>`;
}
const plural=(n,a,b,c)=>{const m=n%100,k=n%10;return m>10&&m<20?c:k===1?a:k>1&&k<5?b:c};

/* ================= views ================= */
function viewDays(){
 let days=ALLDAYS.filter(d=>daySlots(d).length||EXPERTS.some(e=>st.experts.has(e.name)&&absentOn(e.name,d)));
 if(!st.past)days=days.filter(d=>d>=TODAY);
 if(!days.length)return `<p class="empty" style="padding:30px 0">Ничего не найдено — снимите фильтры или включите «прошедшие дни».</p>`;
 let html='',wk='';
 days.forEach(d=>{
  const ws=weekStart(d);
  if(ws!==wk){wk=ws;html+=`<div class="weekhead">Неделя ${fmtShort(ws)} — ${fmtShort(addDays(ws,6))}</div>`}
  html+=dayCard(d);
 });
 return html;
}
function viewWeek(){
 const ws=st.week, days=[...Array(7)].map((_,i)=>addDays(ws,i));
 const rows=EXPERTS.filter(e=>st.experts.has(e.name)).map(e=>{
  const cells=days.map(d=>{
   const a=absentOn(e.name,d);
   const items=daySlots(d).filter(s=>s.expert===e.name);
   let inner=items.map(s=>{const m=STAGES[s.stage];
     return `<span class="mini ${m.cls}">${m.short}${s.total>1?' <em>'+s.part+'/'+s.total+'</em>':''}<em> · ${s.who==='Команда'?'команда':'эксперт'}</em></span>`}).join('');
   if(a&&!items.length)inner=`<span class="miniout">отсутствует</span>`;
   else if(a)inner+=`<span class="miniout">отсутствует</span>`;
   return `<td class="${d===TODAY?'today':''}">${inner}</td>`}).join('');
  return `<tr><td class="ecol"><button class="who" data-expert="${esc(e.name)}">${esc(e.name)}</button></td>${cells}</tr>`;
 }).join('');
 const th=days.map(d=>`<th class="dcol ${d===TODAY?'today':''}">${WD[dow(d)]}<small>${fmtShort(d)}</small></th>`).join('');
 return `<div class="navrow">
   <button class="nav" id="wPrev" title="Предыдущая неделя">‹</button>
   <button class="nav" id="wNext" title="Следующая неделя">›</button>
   <h2>${fmt(ws)} — ${fmt(addDays(ws,6))}</h2>
   <div class="spacer"></div><button class="ctl" id="wToday">Текущая неделя</button></div>
  <div class="gridwrap"><table class="wk"><thead><tr><th class="ecol">Эксперт</th>${th}</tr></thead>
  <tbody>${rows||'<tr><td class="ecol">—</td><td colspan="7" class="empty">Нет экспертов в фильтре</td></tr>'}</tbody></table></div>`;
}
function viewMonth(){
 const months=[];let m=D(FIRST);m.setDate(1);
 const last=D(LAST);
 while(m<=last){months.push(iso(m));m=new Date(m.getFullYear(),m.getMonth()+1,1)}
 return `<div class="months">`+months.map(ms=>{
  const first=D(ms), y=first.getFullYear(), mo=first.getMonth();
  const nd=new Date(y,mo+1,0).getDate(), off=dow(ms);
  let cells='';
  for(let i=0;i<off;i++)cells+=`<div class="mcell blank"></div>`;
  for(let day=1;day<=nd;day++){
   const d=y+'-'+pad(mo+1)+'-'+pad(day), list=daySlots(d);
   const dots=ORDER.filter(s=>list.some(x=>x.stage===s)).map(s=>`<i class="${STAGES[s].cls}"></i>`).join('');
   const names=[...new Set(list.map(s=>surname(s.expert)))].slice(0,4).join(', ');
   cells+=`<button class="mcell ${d===TODAY?'today':''}" data-day="${d}">
     <span class="n">${day}${list.length?'<b>'+list.length+'</b>':''}</span>
     <span class="dots">${dots}</span><span class="mnames">${esc(names)}</span></button>`;
  }
  return `<div class="mcard"><h3>${MONNOM[mo]} ${y}</h3>
   <div class="mgrid">${WD.map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div></div>`;
 }).join('')+`</div>`;
}
function viewExperts(){
 return `<div class="exgrid" style="margin-top:18px">`+EXPERTS.filter(e=>st.experts.has(e.name)).map(e=>{
  const evs=DATA.events.filter(x=>x.expert===e.name);
  const cycles=[...new Set(evs.map(x=>x.cycle))];
  const chain=cycles.map(c=>{
   const steps=evs.filter(x=>x.cycle===c).sort((a,b)=>STAGES[a.stage].n-STAGES[b.stage].n)
    .map(x=>{const m=STAGES[x.stage];
      return `<span class="step ${m.cls}">${m.short} <em>${fmtShort(x.start)}${x.days>1?'–'+fmtShort(x.end):''}</em></span>`}).join('');
   return `<div class="cyc"><div class="cname">${esc(c)}</div><div class="chain">${steps}</div></div>`}).join('');
  return `<div class="excard"><h3>${esc(e.name)}</h3>
   <a class="lnk" href="${e.sheet}" target="_blank" rel="noopener">Личный календарь ↗</a>
   ${chain}
   <dl class="facts">
    <dt>Голосовые</dt><dd>${esc(e.voice||'—')}</dd>
    <dt>Съёмка</dt><dd>${esc(e.shoot||'—')}</dd>
    <dt>Объём</dt><dd>${esc(e.volume||'—')}</dd>
    <dt>Сценарий</dt><dd>${esc(e.lead||'—')}</dd>
    ${(e.absences||[]).length?`<dt>Отсутствие</dt><dd>${e.absences.map(a=>fmtShort(a.from)+'–'+fmtShort(a.to)).join(', ')}</dd>`:''}
   </dl>
   ${(e.notes||[]).map(n=>`<div class="note">${esc(n)}</div>`).join('')}</div>`;
 }).join('')+`</div>`;
}

/* ================= drawer ================= */
function openExpert(name){
 const e=BYNAME[name];if(!e)return;
 const evs=DATA.events.filter(x=>x.expert===name);
 const next=SLOTS.filter(s=>s.expert===name&&s.day>=TODAY).slice(0,6);
 document.getElementById('drawer').innerHTML=`<button class="x" id="dx">✕</button>
  <div class="eyebrow">эксперт</div><h2 style="font-size:20px;margin:4px 0 6px">${esc(name)}</h2>
  <a class="lnk" href="${e.sheet}" target="_blank" rel="noopener">Личный контент-календарь ↗</a>
  <dl class="facts" style="margin-top:14px">
   <dt>Старт месяца</dt><dd>${esc(e.start||'—')}</dd>
   <dt>Голосовые</dt><dd>${esc(e.voice||'—')}</dd>
   <dt>Съёмка</dt><dd>${esc(e.shoot||'—')}</dd>
   <dt>Роликов за подход</dt><dd>${esc(e.volume||'—')}</dd>
   <dt>Сценарий нужен</dt><dd>${esc(e.lead||'—')}</dd>
   ${(e.absences||[]).length?`<dt>Отсутствие</dt><dd>${e.absences.map(a=>fmtShort(a.from)+'–'+fmtShort(a.to)+' ('+esc(a.label)+')').join('<br>')}</dd>`:''}
  </dl>
  ${(e.notes||[]).map(n=>`<div class="note">${esc(n)}</div>`).join('')}
  <div class="weekhead" style="margin:20px 0 10px">Ближайшие шаги</div>
  <div class="rows">${next.length?next.map(s=>`<div class="task ${STAGES[s.stage].cls}">
     <span class="bar"></span><span class="who" style="cursor:default">${fmt(s.day)}, ${WD[dow(s.day)]}</span>
     <div class="act"><b>${STAGES[s.stage].short}</b> — ${s.who==='Команда'?'команда':'эксперт'}</div>
     <div class="meta"><span class="badge">${esc(s.cycle)}</span></div></div>`).join(''):'<div class="empty">Запланированных шагов нет</div>'}</div>
  <div class="weekhead" style="margin:20px 0 10px">Все циклы</div>
  ${[...new Set(evs.map(x=>x.cycle))].map(c=>`<div class="cyc"><div class="cname">${esc(c)}</div><div class="chain">${
    evs.filter(x=>x.cycle===c).sort((a,b)=>STAGES[a.stage].n-STAGES[b.stage].n).map(x=>{const m=STAGES[x.stage];
    return `<span class="step ${m.cls}">${m.short} <em>${fmtShort(x.start)}</em></span>`}).join('')}</div></div>`).join('')}`;
 document.getElementById('drawer').classList.add('on');
 document.getElementById('scrim').classList.add('on');
 document.getElementById('dx').onclick=closeDrawer;
}
function closeDrawer(){document.getElementById('drawer').classList.remove('on');document.getElementById('scrim').classList.remove('on')}

/* ================= header ================= */
function renderHeader(){
 document.getElementById('subline').innerHTML=
  `${EXPERTS.length} экспертов · ${DATA.events.length} задач · период ${fmtShort(FIRST)} — ${fmtShort(LAST)}.2026 · `+
  `<a href="${DATA.source}" target="_blank" rel="noopener">сводная таблица календарей ↗</a>`;
 const wkStart=weekStart(TODAY), wkEnd=addDays(wkStart,6);
 const inWeek=SLOTS.filter(s=>s.day>=wkStart&&s.day<=wkEnd);
 const todayL=BYDAY[TODAY]||[], future=SLOTS.filter(s=>s.day>=TODAY);
 document.getElementById('stats').innerHTML=[
  ['Экспертов',EXPERTS.length],['Циклов',new Set(DATA.events.map(e=>e.expert+e.cycle)).size],
  ['Задач всего',DATA.events.length],['Сегодня',todayL.length],
  ['На этой неделе',inWeek.length],['Осталось впереди',future.length]
 ].map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');
 const card=(day,title)=>{
  const list=(BYDAY[day]||[]);
  const team=list.filter(s=>s.who==='Команда'),exp=list.filter(s=>s.who==='Эксперт');
  const block=(arr,label,cls)=>arr.length?`<div class="grouplabel ${cls}" style="margin-top:8px"><i></i>${label}</div>
    <div class="nowlist">${arr.map(s=>taskRow(s)).join('')}</div>`:'';
  return `<div class="nowcard ${day===TODAY?'is-today':''}">
   <h3>${title}</h3><div class="dt">${fmt(day)}, ${WDFULL[dow(day)].toLowerCase()}</div>
   ${list.length?block(team,'Команда делает','')+block(exp,'Ждём от эксперта','exp'):'<div class="empty">Задач нет — можно выдохнуть</div>'}
  </div>`};
 document.getElementById('nowpanel').innerHTML=card(TODAY,'Сегодня')+card(addDays(TODAY,1),'Завтра');
 document.getElementById('legend').innerHTML=ORDER.map(s=>
  `<span class="${STAGES[s].cls}"><i></i>${s}</span>`).join('')+
  `<span style="color:var(--ink3)">заливка «Команда делает» / «Ждём от эксперта» — кто ответственный</span>`;
 document.getElementById('footnote').innerHTML=
  `Собрано из ${EXPERTS.length} личных контент-календарей · данные от ${esc(DATA.generated)} · `+
  `страница пересобирается из таблиц автоматически раз в час · `+
  `отметки «выполнено» хранятся только в этом браузере`;
}
function renderChips(){
 const c=document.getElementById('chips');
 c.innerHTML=`<span class="chip" data-all="stages">Этапы:</span>`+
  ORDER.map(s=>`<span class="chip ${STAGES[s].cls} ${st.stages.has(s)?'on':'off'}" data-stage="${esc(s)}"><i class="dot"></i>${STAGES[s].short}</span>`).join('')+
  `<span style="width:14px"></span><span class="chip" data-all="experts">Эксперты:</span>`+
  EXPERTS.map(e=>`<span class="chip ${st.experts.has(e.name)?'on':'off'}" data-expert-f="${esc(e.name)}">${esc(e.name)}</span>`).join('');
}

/* ================= render ================= */
function render(){
 renderHeader();renderChips();
 const m=document.getElementById('main');
 m.innerHTML=st.view==='days'?viewDays():st.view==='week'?viewWeek():st.view==='month'?viewMonth():viewExperts();
 [...document.querySelectorAll('#tabs button')].forEach(b=>b.setAttribute('aria-selected',b.dataset.view===st.view));
 if(st.view==='week'){
  document.getElementById('wPrev').onclick=()=>{st.week=addDays(st.week,-7);render()};
  document.getElementById('wNext').onclick=()=>{st.week=addDays(st.week,7);render()};
  document.getElementById('wToday').onclick=()=>{st.week=weekStart(TODAY);render()};
 }
}
document.addEventListener('click',ev=>{
 const t=ev.target;
 const tab=t.closest('#tabs button'); if(tab){st.view=tab.dataset.view;render();return}
 const ex=t.closest('.who[data-expert]'); if(ex){openExpert(ex.dataset.expert);return}
 const ch=t.closest('.chip'); if(ch){
  if(ch.dataset.stage){st.stages.has(ch.dataset.stage)?st.stages.delete(ch.dataset.stage):st.stages.add(ch.dataset.stage)}
  else if(ch.dataset.expertF){st.experts.has(ch.dataset.expertF)?st.experts.delete(ch.dataset.expertF):st.experts.add(ch.dataset.expertF)}
  else if(ch.dataset.all==='stages'){st.stages=st.stages.size===ORDER.length?new Set():new Set(ORDER)}
  else if(ch.dataset.all==='experts'){st.experts=st.experts.size===EXPERTS.length?new Set():new Set(EXPERTS.map(e=>e.name))}
  render();return}
 const cell=t.closest('.mcell[data-day]'); if(cell){
  const d=cell.dataset.day;
  if(d<TODAY){st.past=true;document.getElementById('pastCb').checked=true}
  st.view='days';render();
  const el=document.getElementById('d'+d); if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  return}
 if(t.id==='scrim'){closeDrawer();return}
 if(t.id==='todayBtn'){
  st.view='days';render();
  let d=TODAY;while(d<=LAST&&!document.getElementById('d'+d))d=addDays(d,1);
  const el=document.getElementById('d'+d)||document.getElementById('main');
  el.scrollIntoView({behavior:'smooth',block:'start'});return}
});
document.addEventListener('change',ev=>{
 const t=ev.target;
 if(t.classList.contains('cb')){
  const id=t.closest('.task').dataset.id;
  t.checked?done.add(id):done.delete(id);saveDone();render();return}
 if(t.id==='whoSel'){st.who=t.value;render()}
 if(t.id==='pastCb'){st.past=t.checked;render()}
 if(t.id==='doneCb'){st.hideDone=t.checked;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
render();
</script>
</body>
</html>
